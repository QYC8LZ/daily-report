<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f3ee" />
  <title>Daily Brief</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><span id="progressBar"></span></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">D</div>
        <div>
          <strong>Daily Brief</strong>
          <span>30 秒扫完 · 10 分钟读透</span>
        </div>
      </div>

      <div class="side-block">
        <div class="side-head"><span>本期目录</span></div>
        <nav id="toc" class="toc" aria-label="本期目录"></nav>
      </div>

      <div class="side-block history-block">
        <div class="side-head">
          <span>历史简报</span>
          <button id="themeToggle" class="icon-btn" aria-label="切换主题">◐</button>
        </div>
        <nav id="history" class="history" aria-label="历史简报"></nav>
      </div>

      <div class="sidebar-foot">公开信息 · 一手来源优先 · 事实与判断分离</div>
    </aside>

    <main class="main">
      <div class="mobile-bar">
        <button id="menuToggle" class="icon-btn" aria-label="打开导航">☰</button>
        <strong>Daily Brief</strong>
        <button id="themeToggleMobile" class="icon-btn" aria-label="切换主题">◐</button>
      </div>

      <article id="report" class="report" aria-live="polite">
        <div class="loading">正在加载简报…</div>
      </article>
    </main>
  </div>

  <template id="emptyTemplate">
    <section class="empty">
      <p class="eyebrow">Daily Brief</p>
      <h1>日报站点已就绪</h1>
      <p>每日 09:00 更新后，这里会显示最新一期。</p>
    </section>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
